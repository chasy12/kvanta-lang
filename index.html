<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kvanta – IDE</title>
  <link rel="icon" type="image/png" href="./web/assets/kvanta-logo.png" />
  <link rel="stylesheet" href="./web/styles.css" />
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="brand">
        <img class="brand__logo" src="./web/assets/kvanta-logo.png" alt="" width="40" height="40" />
        <div class="brand__text"><strong>Kvanta</strong><span>STEM school</span></div>
      </div>
      <div class="lang" role="group" data-i18n-aria-label="language" aria-label="Language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="uk" lang="uk">УК</button>
      </div>
      <div class="toolbar__actions">
        <input type="file" id="fileInput" accept=".quanta,.txt" hidden />
        <button type="button" id="loadBtn" class="button--icon" data-i18n-title="load" title="Відкрити">
          <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 14 8 10h13l-3 10H3V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v2" /></svg>
          <span class="sr-only" data-i18n="load">Відкрити</span>
        </button>
        <button type="button" id="downloadBtn" class="button--icon" data-i18n-title="download" title="Зберегти код">
          <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4" /></svg>
          <span class="sr-only" data-i18n="download">Зберегти код</span>
        </button>
        <button type="button" id="shareBtn" class="button--icon" data-i18n-title="shareTitle" title="Скопіювати посилання на цю програму">
          <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g class="button__share"><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><path d="m8.6 10.5 6.8-4m-6.8 7 6.8 4" /></g><path class="button__check" d="m5 12 5 5 9-10" /></svg>
          <span class="sr-only" data-i18n="share">Поділитися</span>
        </button>
        <button type="button" id="runBtn" class="button--primary button--icon" data-state="run" data-i18n-title="run" title="Запустити">
          <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="button__play" d="m8 5 11 7-11 7Z" /><rect class="button__stop" x="6" y="6" width="12" height="12" rx="1" /></svg>
          <span class="sr-only" data-i18n="run">Запустити</span>
        </button>
      </div>
    </header>
    <main class="panes">
      <section class="pane pane--editor" aria-labelledby="sourceHeading">
        <div class="pane__header"><h1 id="sourceHeading" data-i18n="source">Код</h1></div>
        <div id="editor"></div>
      </section>
      <div class="resizer" id="resizer" aria-hidden="true"></div>
      <section class="pane pane--result" aria-labelledby="resultHeading">
        <div class="pane__header">
          <h2 id="resultHeading" data-i18n="result">Результат</h2>
          <span class="pane__meta" id="fpsCounter" hidden></span>
          <button type="button" id="saveBtn" class="button--quiet button--icon" data-i18n-aria-label="saveImage" data-i18n-title="saveImage" aria-label="Зберегти зображення" title="Зберегти зображення">
            <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9M3 15l5-5 6 6m4-13v12m-4-4 4 4 4-4" /><circle cx="8" cy="7" r="1" /></svg>
          </button>
        </div>
        <div class="resultWrap" id="resultWrap">
          <div class="canvasContainer">
            <canvas id="canvas" class="canvas" width="1000" height="1000" tabindex="0"></canvas>
          </div>
          <div id="consoleResize" class="console__resize" role="separator" aria-orientation="horizontal" aria-controls="consolePanel" tabindex="0"></div>
          <section class="console" id="consolePanel">
            <div class="console__header">
              <button type="button" id="consoleToggle" class="console__toggle" aria-expanded="true" aria-controls="consoleLines">
                <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="m7 9 3 3-3 3m6 0h4" /></svg>
                <span data-i18n="console">Консоль</span>
              </button>
              <button type="button" id="consoleClear" class="console__clear button--icon" data-i18n-aria-label="clear" data-i18n-title="clear" aria-label="Очистити" title="Очистити">
                <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 21-4.3-4.3a2 2 0 0 1 0-2.8L13.6 3a2 2 0 0 1 2.8 0l4.3 4.3a2 2 0 0 1 0 2.8L10 21H7ZM5 11l9 9M10 21h11" /></svg>
              </button>
            </div>
            <ol id="consoleLines" class="console__lines" role="log" data-i18n-empty="consoleEmpty"></ol>
            <div id="consoleInput" class="console__input" hidden></div>
          </section>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="./web/main.js"></script>
</body>
</html>
