<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kvanta – IDE</title>
  <style>
    :root {
      --border: #e5e7eb;
      --bg: #0b1020;
      --panel: #0f172a;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --line: rgba(226, 232, 240, 0.12);
      --error: #f87171;
      --error-text: #fecaca;
      --error-bg: rgba(69, 10, 10, 0.6);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    html, body { height: 100%; margin: 0; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji"; background: var(--bg); color: var(--text); }

    .app {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      grid-template-rows: auto 1fr;
    }

    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
      padding: 10px 12px; border-bottom: 1px solid var(--border); background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
    }
    .toolbar h1 { font-size: 16px; font-weight: 600; margin: 0; color: var(--muted); }
    .spacer { flex: 1; }
    button {
      appearance: none; border: 1px solid transparent; border-radius: 999px;
      padding: 8px 14px; font-weight: 600; cursor: pointer;
      background: var(--accent); color: #0b1020;
      box-shadow: 0 10px 18px rgba(34, 211, 238, 0.25);
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .panes {
  display: grid;
  grid-template-columns: 1fr 4px 1fr; /* default: side-by-side with resizer */
  height: 100%;
}
    .pane {
      position: relative; height: 100%; width: 100%;
      border-right: 1px solid var(--border);
    }
    .pane:last-child { border-right: 0; overflow: hidden;}
    .pane__header {
      position: absolute; top: 8px; right: 12px; z-index: 3;
      font-size: 12px; color: var(--muted);
      background: rgba(2,6,23,0.35); padding: 4px 8px; border-radius: 999px; border: 1px solid rgba(226,232,240,0.1);
    }
    .pane__header--start { right: auto; left: 12px; font-variant-numeric: tabular-nums; }

    /* Output box */
    #output {
      position: absolute; inset: 0; padding: 12px 14px 14px 14px; overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      white-space: pre-wrap; word-break: break-word;
      background: var(--panel);
    }

    /* CodeMirror container fills the pane */
    #editor { position: absolute;
  top: 0; bottom: 0; left: 0; right: 0;
  overflow: auto;  }

    /* Small screens: stack panes */
    @media (max-width: 900px) {
  .panes {
    flex-direction: column;
    grid-template-columns: 1fr;       /* stack vertically */
    grid-template-rows: auto auto;    /* one row per pane */
  }

  .resizer {
    display: none;
  }

  .pane {
    min-width: 0;
    border-right: none;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }

  .pane:last-child {
    border-bottom: none;
  }

  .editor {
    display: flex;
    flex-grow: 1; /* Allows the editor to fill remaining space */
      overflow-y: auto; /* This is the key change to enable scrolling */
  }
}

    .resizer {
      background: var(--border);
      cursor: col-resize;
      width: 4px;
      height: 100%;
    }
    /* Result pane: canvas at the top, console below */
    .resultWrap {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      box-sizing: border-box;
    }

    .canvasContainer {
      flex: 1; min-height: 0;
      display: flex; justify-content: center; align-items: flex-start;
      padding: 8px 8px 6px;
      overflow: hidden;
    }

    .canvas {
      height: auto;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 1 / 1;
      background: #0a0f1f;
      display: block;
      border: 1px solid var(--line);
    }

    .console {
      flex: 0 0 32%; min-height: 120px;
      display: flex; flex-direction: column;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    .console__header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 8px 4px 12px;
      font-size: 12px; color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    .console__clear {
      padding: 3px 10px; font-size: 12px; font-weight: 500;
      background: transparent; color: var(--muted); box-shadow: none;
      border: 1px solid var(--line);
    }
    .console__clear:hover { color: var(--text); }
    .console__lines {
      flex: 1; min-height: 0; overflow: auto;
      margin: 0; padding: 4px 0; list-style: none;
      font-family: var(--mono); font-size: 13px; line-height: 1.5;
    }
    .console__lines:empty::before {
      content: attr(data-empty);
      display: block; padding: 4px 12px;
      color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .console__line {
      display: flex; align-items: baseline; gap: 10px;
      padding: 1px 12px;
      white-space: pre-wrap; word-break: break-word;
    }
    .console__line + .console__line { border-top: 1px solid rgba(226, 232, 240, 0.04); }
    .console__time {
      flex: none; color: var(--muted); opacity: 0.6;
      font-size: 11px; font-variant-numeric: tabular-nums;
    }
    .console__text { flex: 1; min-width: 0; }
    .console__line--info { color: var(--muted); }
    .console__line--error {
      color: var(--error-text); background: var(--error-bg);
      border-left: 2px solid var(--error); padding-left: 10px;
    }
    .console__kind { color: var(--error); font-weight: 600; }
    .console__loc {
      flex: none; align-self: center;
      padding: 0 8px; font: 600 11px/1.6 var(--mono);
      background: transparent; color: var(--error); box-shadow: none;
      border: 1px solid var(--error); border-radius: 999px;
    }
    .console__loc:hover { background: var(--error); color: var(--bg); }
    .console__count {
      flex: none; align-self: center;
      padding: 0 6px; border-radius: 999px;
      font-size: 11px; color: var(--bg); background: var(--muted);
    }
    .console__swatch {
      display: inline-block; width: 0.8em; height: 0.8em; margin-right: 4px;
      vertical-align: -0.05em; border-radius: 2px;
      border: 1px solid var(--line);
    }

    /* Language switch */
    .lang {
      display: inline-flex; padding: 2px; gap: 2px;
      border: 1px solid var(--line); border-radius: 999px;
    }
    .lang button {
      padding: 3px 10px; font-size: 12px;
      background: transparent; color: var(--muted); box-shadow: none;
    }
    .lang button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }

.cm-error {
  text-decoration: underline red wavy;
}
.cm-error-msg {
  color: #f87171;
  font-size: 12px;
  margin-left: 8px;
}
    </style>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <strong>Kvanta</strong>
      <div class="lang" role="group" data-i18n-aria-label="language" aria-label="Language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="uk" lang="uk">УК</button>
      </div>
      <div class="spacer"></div>
      <!-- hidden file input -->
      <input type="file" id="fileInput" accept=".quanta,.txt" style="display:none">
      <button id="downloadBtn" data-i18n="download">Download</button>
      <button id="loadBtn" data-i18n="load">Load from file</button>
      <button id="saveBtn" data-i18n="saveImage">Save Image</button>
      <button id="shareBtn" data-i18n="share" data-i18n-title="shareTitle" title="Copy a link that opens this program">Share</button>
      <button id="runBtn" data-i18n="run">Run your program!</button>
    </div>
    <div class="panes">
      <div class="pane">
        <div class="pane__header" data-i18n="source">Source</div>
        <div id="editor"></div>
      </div>
      <div class="resizer" id="resizer" aria-hidden="true"></div>
      <div class="pane">
        <div class="pane__header" data-i18n="result">Result</div>
        <div class="pane__header pane__header--start" id="fpsCounter" hidden></div>
        <div class="resultWrap">
          <div class="canvasContainer">
            <canvas id="canvas" class="canvas" width="1000" height="1000" tabindex="0"></canvas>
          </div>
          <section class="console">
            <div class="console__header">
              <span data-i18n="console">Console</span>
              <button type="button" id="consoleClear" class="console__clear" data-i18n="clear">Clear</button>
            </div>
            <ol id="consoleLines" class="console__lines" role="log" data-i18n-empty="consoleEmpty"></ol>
          </section>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./web/main.js"></script>
</body>
</html>
