# Builds the WASM interpreter and the web IDE, runs the tests, and publishes
# the site to GitHub Pages on every push to main.
# Repo setting needed once: Settings → Pages → Source: "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quanta-lang
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build interpreter (WASM)
        working-directory: quanta-lang
        run: wasm-pack build --release --target web

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Pull requests only build and test; pushes to main (or a manual run) publish.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
